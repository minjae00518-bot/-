<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 행운 메시지</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 85%;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .message-box {
            margin: 20px 0;
            padding: 20px;
            background-color: #e8f4f8;
            border-radius: 12px;
            font-size: 1.05rem;
            color: #2c3e50;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍀 오늘의 행운 메시지 🍀</h1>
        <div class="message-box" id="message">버튼을 눌러 오늘의 메시지를 확인하세요!</div>
        <button onclick="drawMessage()">메시지 뽑기</button>
    </div>

    <script>
        const messages = [
            "오늘 당신에게 아주 특별하고 멋진 일이 일어납니다!",
            "지치고 힘들 땐 잠시 쉬어가도 괜찮아요.",
            "꾸준히 노력한 일들이 곧 결실을 맺을 거예요.",
            "오늘 저녁엔 좋아하는 음식을 나에게 선물해 보세요.",
            "당신은 생각보다 훨씬 더 강하고 멋진 사람입니다.",
            "웃으면 복이 와요! 지금 한 번 크게 웃어보세요.",
            "새로운 도전을 두려워하지 마세요. 당신은 할 수 있습니다!",
            "오늘 생각지도 못한 곳에서 기분 좋은 소식이 찾아옵니다.",
            "당신이 걸어가는 길에 행운의 별빛이 가득할 거예요.",
            "오늘 마주치는 모든 신호등이 초록불일 확률 100%!",
            "스스로를 믿으세요. 당신은 지금까지 잘해왔고 앞으로도 잘할 거예요.",
            "오늘 하루, 생각했던 일들이 막힘없이 술술 풀립니다.",
            "뜻밖의 소소한 행운이나 선물이 당신을 기다리고 있습니다.",
            "오늘 가장 빛나는 주인공은 바로 당신입니다.",
            "완벽하지 않아도 괜찮아요. 당신의 시도 자체가 이미 멋집니다.",
            "오늘 하루, 당신이 가는 길마다 따스한 햇살이 함께합니다.",
            "걱정하던 일이 거짓말처럼 부드럽게 해결될 거예요.",
            "오늘만큼은 나 자신을 맘껏 칭찬해 주는 하루로 만드세요.",
            "지금 떠오른 그 아이디어, 꼭 실행해 보세요! 대박 예감!",
            "작은 친절 하나가 오늘 당신에게 더 큰 행복으로 돌아옵니다."
        ];

        function drawMessage() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById('message').innerText = messages[randomIndex];
        }
    </script>
</body>
</html>
